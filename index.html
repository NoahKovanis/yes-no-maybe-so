<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yes / No Oracle</title>
  <style>
    :root {
      --ink: #20252b;
      --muted: #6f767e;
      --paper: #f6f1e8;
      --panel: #fffdf8;
      --line: #ded7ca;
      --yellow: #f6c945;
      --green: #287c62;
      --red: #c75445;
      --shadow: 0 18px 55px rgba(45, 39, 29, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(246, 201, 69, 0.28), transparent 26rem),
        linear-gradient(135deg, #f6f1e8 0%, #eee8dc 100%);
      font-family: Georgia, 'Times New Roman', serif;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 64px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font: 700 0.76rem/1.2 Arial, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 640px;
      margin: 0;
      font-size: clamp(3rem, 8vw, 6.2rem);
      line-height: 0.92;
      letter-spacing: -0.05em;
      font-weight: 700;
    }

    .intro {
      max-width: 560px;
      margin: 24px 0 34px;
      color: var(--muted);
      font-size: 1.14rem;
      line-height: 1.55;
    }

    .oracle {
      display: block;
    }

    .ask-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .ask-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 390px;
      padding: clamp(24px, 5vw, 48px);
    }

    label {
      display: block;
      margin-bottom: 12px;
      font: 700 0.77rem/1.2 Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 15px 16px;
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 0;
      font: 1.05rem Georgia, 'Times New Roman', serif;
      outline: none;
    }

    input:focus { border-color: var(--green); }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 0;
      font: 700 0.84rem Arial, sans-serif;
    }

    .ask-button {
      flex: 0 0 auto;
      padding: 0 22px;
      color: var(--ink);
      background: var(--yellow);
    }

    .ask-button:hover { background: #eebd31; }

    .answer {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      margin-top: 34px;
      padding: 20px;
      background: #f4efe5;
      color: var(--muted);
      text-align: center;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1;
      text-transform: none;
    }

    .answer.yes { color: var(--green); }
    .answer.no { color: var(--red); }
    .answer.idk { color: var(--muted); }
    .answer.long {
      display: block;
      min-height: 260px;
      color: var(--ink);
      font-size: 1.1rem;
      line-height: 1.6;
      text-align: left;
      text-transform: none;
      white-space: pre-wrap;
    }

    .list-panel { padding: 28px; }

    .list-panel h2 {
      margin: 0 0 8px;
      font-size: 1.55rem;
    }

    .list-panel p {
      margin: 0 0 20px;
      color: var(--muted);
      font: 0.88rem/1.5 Arial, sans-serif;
    }

    .question-list {
      display: grid;
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .question-list button {
      width: 100%;
      padding: 12px 13px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      text-align: left;
      font: 0.9rem/1.35 Georgia, 'Times New Roman', serif;
    }

    .question-list button:hover,
    .question-list button:focus-visible {
      border-color: var(--green);
      background: #f1f7f2;
      outline: none;
    }

    .hint {
      margin-top: 18px;
      color: var(--muted);
      font: 0.76rem/1.4 Arial, sans-serif;
    }

    @media (max-width: 700px) {
      main { padding-top: 34px; }
      .oracle { grid-template-columns: 1fr; }
      .ask-panel { min-height: 330px; }
    }

    @media (max-width: 450px) {
      .input-row { flex-direction: column; }
      .ask-button { padding: 14px 20px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A very small answer machine</p>
    <h1>Ask it something.<br>Get a verdict.</h1>
    <p class="intro">This oracle only knows a short list of questions. It answers those with a firm yes or no. Everything else gets an uncertain answer.</p>

    <section class="oracle" aria-label="Question oracle">
      <form class="ask-panel" id="oracle-form">
        <div>
          <label for="question">Your question</label>
          <div class="input-row">
            <input id="question" name="question" type="text" autocomplete="off" placeholder="Ask a yes or no question..." required>
            <button class="ask-button" type="submit">Ask</button>
          </div>
        </div>
        <div class="answer idk" id="answer" aria-live="polite">idk</div>
      </form>

    </section>
  </main>

  <script>
    const answers = new Map([
      ['is the sky blue?', 'yes'],
      ['are cats and dogs different animals?', 'yes'],
      ['is water drinkable?', 'yes'],
      ['is fire hot?', 'yes'],
      ['is ea a horrible company?', 'yes'],
      ['does food talk?', 'no'],
      ['is the earth flat?', 'no'],
      ['is a pickle a vegetable?', 'no'],
      ['is food free?', 'no'],
      ['do we live on the sun?', 'no']
    ]);

    const unknownAnswers = [
      'idk',
      'maybe',
      'not sure',
      'unknown',
      'ask somebody else',
      'that is above my pay grade',
      'you tell me'
    ];
    let unknownAnswerIndex = 0;

    const form = document.querySelector('#oracle-form');
    const input = document.querySelector('#question');
    const answer = document.querySelector('#answer');
    const longAnswerChance = 1 / 1000000;
    let forceLongAnswer = false;
    let typingTimer;

    const longAnswer = `I'll have to put you on hold.

    First, we must acknowledge the question itself. It arrived here, in this small box, carrying the expectation of a quick answer. That expectation was understandable. It was also, regrettably, optimistic.

    We could answer immediately. We could choose a word, place it on the screen, and move on with the rest of the day. But before we do that, we should consider whether a quick answer would truly respect the complicated relationship between questions, answers, and the people who wait for them.

    There are many things to consider. There is the wording. There is the punctuation. There is the possibility that the question means something slightly different from what it appears to mean. There is also the question of whether the answer, once given, would create more questions. These are not small matters.

    So we continue. We review the evidence. We review the review of the evidence. We take a brief pause to think about taking a brief pause. We consider the possibility that this process has become longer than necessary, and then we consider that possibility for a little while longer.

    At last, after all this careful and extremely deliberate thought, we arrive at the conclusion that your patience has been noted. The answer is still being prepared. Thank you for waiting.`;

    function typeLongAnswer() {
      clearInterval(typingTimer);
      answer.className = 'answer long';
      answer.textContent = '';
      let characterIndex = 0;
      typingTimer = setInterval(() => {
        answer.textContent += longAnswer[characterIndex++];
        if (characterIndex >= longAnswer.length) {
          clearInterval(typingTimer);
        }
      }, 90);
    }

    function normalizeQuestion(question) {
      return question
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function levenshteinDistance(a, b) {
      const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));

      for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
      for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }

      return matrix[a.length][b.length];
    }

    function findClosestQuestion(question) {
      const normalizedInput = normalizeQuestion(question);
      let closestQuestion = null;
      let closestDistance = Infinity;

      for (const knownQuestion of answers.keys()) {
        const distance = levenshteinDistance(normalizedInput, normalizeQuestion(knownQuestion));
        if (distance < closestDistance) {
          closestDistance = distance;
          closestQuestion = knownQuestion;
        }
      }

      return closestDistance <= 2 ? closestQuestion : null;
    }

    function capitalizeFirstLetter(text) {
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    function sentenceCase(text) {
      if (!text) return text;
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    function ask(question) {
      const trimmedQuestion = question.trim();

      if (!trimmedQuestion) {
        answer.textContent = 'What';
        answer.className = 'answer';
        return;
      }

      const matchingKnownQuestion = Array.from(answers.keys()).find((knownQuestion) => normalizeQuestion(knownQuestion) === normalizeQuestion(trimmedQuestion));

      if (matchingKnownQuestion) {
        const canonicalQuestion = capitalizeFirstLetter(matchingKnownQuestion.replace(/\?$/, '')) + '?';

        if (trimmedQuestion === canonicalQuestion) {
          if (forceLongAnswer || Math.random() < longAnswerChance) {
            forceLongAnswer = false;
            typeLongAnswer();
            return;
          }

          const knownAnswer = answers.get(matchingKnownQuestion);
          answer.textContent = sentenceCase(knownAnswer);
          answer.className = `answer ${knownAnswer}`;
          return;
        }

        const formattedQuestion = capitalizeFirstLetter(matchingKnownQuestion.replace(/\?$/, ''));
        answer.textContent = `Don't you mean '${formattedQuestion}?'`;
        answer.className = 'answer idk';
        input.value = '';
        return;
      }

      if (!trimmedQuestion.endsWith('?')) {
        answer.textContent = 'What';
        answer.className = 'answer';
        return;
      }

      if (forceLongAnswer || Math.random() < longAnswerChance) {
        forceLongAnswer = false;
        typeLongAnswer();
        return;
      }

      const cleanQuestion = trimmedQuestion.toLowerCase();
      const knownAnswer = answers.get(cleanQuestion);

      if (knownAnswer) {
        answer.textContent = sentenceCase(knownAnswer);
        answer.className = `answer ${knownAnswer}`;
        return;
      }

      const correctedQuestion = findClosestQuestion(trimmedQuestion);
      if (correctedQuestion) {
        const formattedQuestion = capitalizeFirstLetter(correctedQuestion.replace(/\?$/, ''));
        answer.textContent = `Don't you mean '${formattedQuestion}?'`;
        answer.className = 'answer idk';
        input.value = '';
        return;
      }

      const result = unknownAnswers[unknownAnswerIndex++ % unknownAnswers.length];
      answer.textContent = sentenceCase(result);
      answer.className = `answer ${result}`;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      ask(input.value);
    });
  </script>
</body>
</html>
